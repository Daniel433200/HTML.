<fieldset>
           <h1>Datos personales</h1>
            
            <label for="nombre">Nombre:</label><br>
            <input type="text" id="nombre" name="nombre" required maxlength="100" autofocus><br><br>

            <label for="apellidos">Apellidos:</label><br>
            <input type="text" id="apellidos" name="apellidos" required maxlength="100"><br><br>

            <label for="dni">DNI:</label><br>
            <input type="text" id="dni" name="dni" required maxlength="10" placeholder="DNI con letra">
        </fieldset>
        <h1>Datos de su estancia</h1>
            
            <p>Habitación:</p>
            <input type="radio" id="ind" 
            name="Habitación" value="Individual">
            <label for="ind">Individual</label><br>
            <input type="radio" id="dob" 
            name="Habitación" value="Doble">
            <label for="dob">Doble</label><br>
            <input type="radio" id="tri" 
            name="Habitación" value="Triple">
            <label for="tri">Triple</label><br><br>

            <label for="personas">Número de personas:</label><br>
            <select id="personas" name="personas">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
            </select><br><br>

            <input type="checkbox" id="mascotas" name="mascotas">
            <label for="mascotas">Llevo mascotas</label><br><br>

            <label for="llegada">Fecha de llegada:</label><br>
            <input type="date" id="llegada" name="llegada"><br><br>
        </fieldset>
